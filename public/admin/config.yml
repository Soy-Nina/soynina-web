backend:
  name: github
  repo: Soy-Nina/soynina-web
  branch: staging

media_folder: "public/reports"
public_folder: "/reports"

locale: "es"

# YAML anchor — defined once, reused for both es and en file entries
x-translation-fields: &translation-fields

  - label: "Metadata"
    name: "Metadata"
    widget: "object"
    fields:
      - { label: "Título / Title", name: "title", widget: "string" }
      - { label: "Descripción / Description", name: "description", widget: "text" }

  - label: "Navigation"
    name: "Navigation"
    widget: "object"
    fields:
      - { label: "¿Quiénes Somos?", name: "quienesSomos", widget: "string" }
      - { label: "Programas", name: "programas", widget: "string" }
      - { label: "Voluntariado", name: "voluntariado", widget: "string" }
      - { label: "Blog", name: "blog", widget: "string" }
      - { label: "Eventos", name: "eventos", widget: "string" }
      - { label: "Informes", name: "informes", widget: "string" }
      - { label: "Contacto", name: "contacto", widget: "string" }
      - { label: "Sostenibilidad", name: "sostenibilidad", widget: "string" }
      - { label: "FAQ", name: "faq", widget: "string" }
      - { label: "Donar Ahora", name: "donarAhora", widget: "string" }
      - { label: "Cambiar idioma", name: "changeLanguage", widget: "string" }

  - label: "Hero"
    name: "Hero"
    widget: "object"
    fields:
      - { label: "Eyebrow", name: "eyebrow", widget: "string" }
      - { label: "Headline 1", name: "headline1", widget: "string" }
      - { label: "Headline (highlighted)", name: "headlineHighlight", widget: "string" }
      - { label: "Headline 2", name: "headline2", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "CTA Donar", name: "ctaDonate", widget: "string" }
      - { label: "CTA Voluntaria", name: "ctaVolunteer", widget: "string" }
      - { label: "Alt imagen", name: "imageAlt", widget: "string" }
      - label: "Stats"
        name: "stats"
        widget: "object"
        fields:
          - label: "Vidas impactadas"
            name: "livesImpacted"
            widget: "object"
            fields:
              - { label: "Valor", name: "value", widget: "string" }
              - { label: "Etiqueta", name: "label", widget: "string" }
          - label: "Niñas activas"
            name: "activeGirls"
            widget: "object"
            fields:
              - { label: "Valor", name: "value", widget: "string" }
              - { label: "Etiqueta", name: "label", widget: "string" }
          - label: "Horas voluntariado"
            name: "volunteerHours"
            widget: "object"
            fields:
              - { label: "Valor", name: "value", widget: "string" }
              - { label: "Etiqueta", name: "label", widget: "string" }
          - label: "Comunidades"
            name: "communities"
            widget: "object"
            fields:
              - { label: "Valor", name: "value", widget: "string" }
              - { label: "Etiqueta", name: "label", widget: "string" }

  - label: "Programs"
    name: "Programs"
    widget: "object"
    fields:
      - { label: "Eyebrow", name: "eyebrow", widget: "string" }
      - { label: "Título 1", name: "title1", widget: "string" }
      - { label: "Título 2", name: "title2", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text" }
      - { label: "Ver todos", name: "viewAll", widget: "string" }
      - label: "Programa 1 (Club Niña)"
        name: "program1"
        widget: "object"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Edad", name: "age", widget: "string" }
          - { label: "Descripción", name: "description", widget: "text" }
          - label: "Actividades"
            name: "activities"
            widget: "list"
            field: { label: "Actividad", name: "activity", widget: "string" }
      - label: "Programa 2 (Club Cole)"
        name: "program2"
        widget: "object"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Edad", name: "age", widget: "string" }
          - { label: "Descripción", name: "description", widget: "text" }
          - label: "Actividades"
            name: "activities"
            widget: "list"
            field: { label: "Actividad", name: "activity", widget: "string" }
      - label: "Programa 3 (Club Familias)"
        name: "program3"
        widget: "object"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Edad", name: "age", widget: "string" }
          - { label: "Descripción", name: "description", widget: "text" }
          - label: "Actividades"
            name: "activities"
            widget: "list"
            field: { label: "Actividad", name: "activity", widget: "string" }
      - label: "Programa 4 (Tutorías)"
        name: "program4"
        widget: "object"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Edad", name: "age", widget: "string" }
          - { label: "Descripción", name: "description", widget: "text" }
          - label: "Actividades"
            name: "activities"
            widget: "list"
            field: { label: "Actividad", name: "activity", widget: "string" }

  - label: "Impact"
    name: "Impact"
    widget: "object"
    fields:
      - { label: "Eyebrow", name: "eyebrow", widget: "string" }
      - { label: "Título 1", name: "title1", widget: "string" }
      - { label: "Título (highlighted)", name: "titleHighlight", widget: "string" }
      - { label: "Título 2", name: "title2", widget: "string" }
      - { label: "Descripción", name: "description", widget: "text" }
      - label: "Stats"
        name: "stats"
        widget: "object"
        fields:
          - label: "Stat 1"
            name: "stat1"
            widget: "object"
            fields:
              - { label: "Valor (número)", name: "value", widget: "number", value_type: "int" }
              - { label: "Sufijo (ej: +)", name: "suffix", widget: "string" }
              - { label: "Etiqueta", name: "label", widget: "string" }
              - { label: "Detalle", name: "detail", widget: "text" }
          - label: "Stat 2"
            name: "stat2"
            widget: "object"
            fields:
              - { label: "Valor (número)", name: "value", widget: "number", value_type: "int" }
              - { label: "Sufijo (ej: +)", name: "suffix", widget: "string" }
              - { label: "Etiqueta", name: "label", widget: "string" }
              - { label: "Detalle", name: "detail", widget: "text" }
          - label: "Stat 3"
            name: "stat3"
            widget: "object"
            fields:
              - { label: "Valor (número)", name: "value", widget: "number", value_type: "int" }
              - { label: "Sufijo", name: "suffix", widget: "string", required: false }
              - { label: "Etiqueta", name: "label", widget: "string" }
              - { label: "Detalle", name: "detail", widget: "text" }
          - label: "Stat 4"
            name: "stat4"
            widget: "object"
            fields:
              - { label: "Valor (número)", name: "value", widget: "number", value_type: "int" }
              - { label: "Sufijo (ej: %)", name: "suffix", widget: "string" }
              - { label: "Etiqueta", name: "label", widget: "string" }
              - { label: "Detalle", name: "detail", widget: "text" }
      - { label: "Areas Eyebrow", name: "areasEyebrow", widget: "string" }
      - { label: "Areas Título", name: "areasTitle", widget: "string" }
      - label: "Área 1"
        name: "area1"
        widget: "object"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descripción", name: "description", widget: "text" }
          - { label: "Métrica (ej: 92%)", name: "metric", widget: "string" }
          - { label: "Etiqueta métrica", name: "metricLabel", widget: "string" }
      - label: "Área 2"
        name: "area2"
        widget: "object"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descripción", name: "description", widget: "text" }
          - { label: "Métrica (ej: 5)", name: "metric", widget: "string" }
          - { label: "Etiqueta métrica", name: "metricLabel", widget: "string" }
      - label: "Área 3"
        name: "area3"
        widget: "object"
        fields:
          - { label: "Título", name: "title", widget: "string" }
          - { label: "Descripción", name: "description", widget: "text" }
          - { label: "Métrica (ej: 3×)", name: "metric", widget: "string" }
          - { label: "Etiqueta métrica", name: "metricLabel", widget: "string" }
      - { label: "Presence Eyebrow", name: "presenceEyebrow", widget: "string" }
      - { label: "Presence Título", name: "presenceTitle", widget: "string" }
      - label: "Testimonios"
        name: "testimonials"
        widget: "object"
        fields:
          - label: "Testimonio 1"
            name: "t1"
            widget: "object"
            fields:
              - { label: "Cita", name: "quote", widget: "text" }
              - { label: "Autor/a", name: "author", widget: "string" }
              - { label: "Rol", name: "role", widget: "string" }
          - label: "Testimonio 2"
            name: "t2"
            widget: "object"
            fields:
              - { label: "Cita", name: "quote", widget: "text" }
              - { label: "Autor/a", name: "author", widget: "string" }
              - { label: "Rol", name: "role", widget: "string" }
          - label: "Testimonio 3"
            name: "t3"
            widget: "object"
            fields:
              - { label: "Cita", name: "quote", widget: "text" }
              - { label: "Autor/a", name: "author", widget: "string" }
              - { label: "Rol", name: "role", widget: "string" }
      - { label: "CTA Título", name: "ctaTitle", widget: "string" }
      - { label: "CTA Descripción", name: "ctaDescription", widget: "text" }
      - { label: "CTA Donar", name: "ctaDonate", widget: "string" }
      - { label: "CTA Voluntaria", name: "ctaVolunteer", widget: "string" }

