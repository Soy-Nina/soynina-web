          - { label: "Contenido", name: "content", widget: "text" }
      - label: "Información de contacto"
        name: "contactInfo"
        widget: "object"
        fields:
          - { label: "Organización", name: "organization", widget: "string" }
          - { label: "Email", name: "email", widget: "string" }
          - { label: "Teléfono", name: "phone", widget: "string" }
          - { label: "Dirección", name: "address", widget: "string" }
          - { label: "Cédula", name: "legalId", widget: "string" }
      - { label: "Nota pie", name: "footerNote", widget: "text" }

  - label: "Política de Privacidad (página)"
    name: "PrivacidadPage"
    widget: "object"
    fields:
      - { label: "Meta título", name: "metaTitle", widget: "string" }
      - { label: "Meta descripción", name: "metaDescription", widget: "text" }
      - { label: "Título página", name: "title", widget: "string" }
      - { label: "Fecha actualización", name: "lastUpdated", widget: "string" }
      - label: "Secciones"
        name: "sections"
        widget: "list"
        fields:
          - { label: "Título sección", name: "title", widget: "string" }
          - { label: "Contenido", name: "content", widget: "text" }
      - { label: "Nota pie", name: "footerNote", widget: "text" }

  - label: "Blog (página)"
    name: "BlogPage"
    widget: "object"
    fields:
      - { label: "Hero título", name: "heroTitle", widget: "string" }
      - { label: "Hero subtítulo", name: "heroSubtitle", widget: "string" }
      - { label: "Suscripción blog título", name: "subscribeBlog", widget: "string" }
      - { label: "Suscripción descripción", name: "subscribeDescription", widget: "text" }
      - { label: "Placeholder correo", name: "emailPlaceholder", widget: "string" }
      - { label: "Botón suscribirse", name: "subscribeButton", widget: "string" }
      - { label: "Por (autoría)", name: "by", widget: "string" }

  - label: "Artículo de blog (página)"
    name: "BlogPost"
    widget: "object"
    fields:
      - { label: "No encontrado (título)", name: "notFound", widget: "string" }
      - { label: "No encontrado (volver)", name: "notFoundBack", widget: "string" }
      - { label: "Volver al blog", name: "backToBlog", widget: "string" }
      - { label: "Por (autoría)", name: "by", widget: "string" }
      - { label: "CTA título", name: "ctaTitle", widget: "string" }
      - { label: "CTA descripción", name: "ctaDescription", widget: "text" }
      - { label: "CTA donar", name: "ctaDonate", widget: "string" }
      - { label: "CTA voluntaria", name: "ctaVolunteer", widget: "string" }
      - { label: "Artículos relacionados (título)", name: "relatedTitle", widget: "string" }

collections:
  - name: "blog-es"
    label: "Blog (Español)"
    label_singular: "Artículo"
    folder: "content/blog/es"
    create: true
    slug: "{{slug}}"
    media_folder: "/public/blog-images"
    public_folder: "/blog-images"
    fields:
      - { label: "Título", name: "title", widget: "string" }
      - { label: "Extracto", name: "excerpt", widget: "text" }
      - { label: "Fecha", name: "date", widget: "string", hint: "Ej: 4 de enero, 2026" }
      - { label: "Autor/a", name: "author", widget: "string" }
      - { label: "Categoría", name: "category", widget: "string" }
      - { label: "Imagen de portada", name: "coverImage", widget: "image", required: false, hint: "Si no se sube imagen se usará el gradiente de color." }
      - { label: "Gradiente (CSS)", name: "gradient", widget: "string", default: "from-[#4526c9] to-[#fe35fe]", hint: "Se usa solo si no hay imagen. Ej: from-[#4526c9] to-[#fe35fe]" }
      - { label: "Contenido", name: "body", widget: "markdown" }

  - name: "blog-en"
    label: "Blog (English)"
    label_singular: "Post"
    folder: "content/blog/en"
    create: true
    slug: "{{slug}}"
    media_folder: "/public/blog-images"
    public_folder: "/blog-images"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Excerpt", name: "excerpt", widget: "text" }
      - { label: "Date", name: "date", widget: "string", hint: "E.g. January 4, 2026" }
      - { label: "Author", name: "author", widget: "string" }
      - { label: "Category", name: "category", widget: "string" }
      - { label: "Cover image", name: "coverImage", widget: "image", required: false, hint: "If no image is uploaded, the gradient will be used instead." }
      - { label: "Gradient (CSS)", name: "gradient", widget: "string", default: "from-[#4526c9] to-[#fe35fe]", hint: "Only used when there is no cover image. E.g. from-[#4526c9] to-[#fe35fe]" }
      - { label: "Content", name: "body", widget: "markdown" }

  - name: "reports"
    label: "Informes Mensuales"
    label_singular: "Informe"
    folder: "content/reports"
    create: true
    slug: "{{slug}}"
    fields:
      - { label: "Título", name: "title", widget: "string", hint: "Ej: Informe Marzo 2026" }
      - { label: "Mes", name: "month", widget: "number", value_type: "int", min: 1, max: 12, hint: "Número del mes (1 = Enero, 12 = Diciembre)" }
      - { label: "Año", name: "year", widget: "number", value_type: "int", min: 2020, max: 2099 }
      - { label: "Descripción", name: "description", widget: "text", hint: "Breve resumen del contenido del informe" }
      - { label: "Archivo PDF", name: "pdf", widget: "file", media_folder: "/public/reports", public_folder: "/reports", hint: "Sube el archivo PDF del informe" }

  - name: "translations"
    label: "Textos del Sitio"
    format: json
    files:
      - name: "es"
        label: "Español (es.json)"
        file: "messages/es.json"
        fields: *translation-fields
      - name: "en"
        label: "English (en.json)"
        file: "messages/en.json"
        fields: *translation-fields
